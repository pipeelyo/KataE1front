name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: round-seeker-309101
  REGION: us-central1
  CLUSTER: katae1
  IMAGE: us-central1-docker.pkg.dev/round-seeker-309101/katae1/front
  WIF: projects/741064653110/locations/global/workloadIdentityPools/github/providers/github
  SA: github-deploy@round-seeker-309101.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build \
            --build-arg VITE_FIREBASE_API_KEY=AIzaSyAJLHPK7uZg7D0f-fQv7scXvJmTAlSueHs \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=round-seeker-309101.firebaseapp.com \
            --build-arg VITE_FIREBASE_PROJECT_ID=round-seeker-309101 \
            --build-arg VITE_FIREBASE_APP_ID=1:741064653110:web:6a0ed99ddd5ac8f60a9b97 \
            --build-arg VITE_API_URL= \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT }}

      - name: Rollout
        run: |
          kubectl -n katae1 set image deployment/front front="$IMAGE:${{ github.sha }}"
          kubectl -n katae1 rollout status deployment/front --timeout=180s
